# Alembic configuration for the source-of-truth schema.
#
# Migrations live inside the package (src/cdc_pipeline/db/migrations) so they ship with
# it and share its imports. The database URL is NOT set here — env.py reads it from the
# repo-root .env via cdc_pipeline.db.engine, keeping .env the single source of truth for
# connection strings (there is no sqlalchemy.url line on purpose).
#
# Run from the repo root:  uv run alembic upgrade head   (or `make seed`).

[alembic]
script_location = src/cdc_pipeline/db/migrations
prepend_sys_path = src
# Zero-padded, sortable filenames (0001_slug.py, 0002_slug.py). Revision ids are set by
# hand in each file to match — this is a small linear history where readable order beats
# random-hash merge ergonomics.
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
